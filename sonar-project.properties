# Cuidarte+ — análisis SonarQube (BACKEND Express + FRONTEND React/Vite)
# Se usa solo con docker-compose.sonar.yml (on-demand).
sonar.projectKey=cuidarte-plus
sonar.projectName=Cuidarte+
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Rutas relativas a la raíz del repo
sonar.sources=BACKEND/src,FRONTEND/src
sonar.tests=BACKEND/src,FRONTEND/src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/uploads/**
sonar.coverage.exclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx,**/vite.config.js,**/tailwind.config.js,**/postcss.config.js

# Lenguaje principal JS/TS (auto-detectado por el scanner, se deja explícito encoding)
sonar.javascript.lcov.reportPaths=BACKEND/coverage/lcov.info,FRONTEND/coverage/lcov.info
